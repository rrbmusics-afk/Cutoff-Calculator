<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNEA Cutoff Calculator | Aethercore Interactive</title>

    <meta name="description" content="Calculate your Tamil Nadu Engineering Admissions (TNEA) cutoff instantly. Premium, high-accuracy calculator with admission predictions and history tracking.">
    <meta name="keywords" content="TNEA, Cutoff Calculator, Tamil Nadu Engineering Admission, Anna University, Engineering Cutoff">
    <meta name="author" content="Aethercore Interactive">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TNEA Cutoff Calculator | Aethercore Interactive">
    <meta property="og:description" content="Calculate your Tamil Nadu Engineering Admissions (TNEA) cutoff instantly with our enterprise-grade predictive tool.">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Light Mode Variables */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.9);
            --history-card: rgba(255, 255, 255, 0.5);
            --glow: rgba(99, 102, 241, 0.15);
        }

        [data-theme="dark"] {
            /* Dark Mode Variables */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --accent: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            --input-bg: rgba(15, 23, 42, 0.6);
            --history-card: rgba(15, 23, 42, 0.3);
            --glow: rgba(129, 140, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, border-color 0.4s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Background Blobs */
        .ambient-glow-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }

        .brand svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.6rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* Main Container Layout */
        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem 1.5rem;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        @media (max-width: 968px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphism Card Base */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Input Controls */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 1rem 1.25rem;
            border-radius: 14px;
            border: 1.5px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--glow);
        }

        .input-wrapper .unit {
            position: absolute;
            right: 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Validation Message */
        .validation-msg {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--danger);
            margin-top: 0.35rem;
            height: 16px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.2s ease;
        }

        .validation-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Button Mechanics */
        .btn {
            width: 100%;
            padding: 1.1rem;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px var(--glow);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Loading Animation State */
        .btn-loading-text {
            display: none;
        }

        .loading .btn-default-text {
            display: none;
        }

        .loading .btn-loading-text {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result View Mechanics */
        #result-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-display {
            text-align: center;
            margin: 1.5rem 0;
        }

        .cutoff-value {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .cutoff-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-weight: 700;
        }

        /* Formula Breakdown Display */
        .breakdown-box {
            background: var(--history-card);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            border: 1px dashed var(--card-border);
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .breakdown-row:last-child {
            margin-bottom: 0;
            padding-top: 0.5rem;
            border-top: 1px solid var(--card-border);
            font-weight: 600;
        }

        /* Prediction Badges */
        .prediction-badge {
            padding: 1rem;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tier-top { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .tier-strong { background: rgba(14, 165, 233, 0.15); color: var(--accent); border: 1px solid rgba(14, 165, 233, 0.2); }
        .tier-moderate { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .tier-limited { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        /* Action Row utilities */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .btn-action {
            background: var(--history-card);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
        }

        .btn-action:hover {
            background: var(--card-border);
            transform: translateY(-2px);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
        }

        /* History Module Architecture */
        .history-section {
            grid-column: 1 / -1;
            margin-top: 1rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-clear {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .history-item {
            background: var(--history-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.25rem;
            position: relative;
        }

        .history-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .history-item-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .history-item-score {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Toast Notifications Engine */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .toast {
            background: var(--text-primary);
            color: var(--input-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(20px);
            animation: toastIn 0.3s forwards;
        }

        @keyframes toastIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Placeholder state for pristine results card */
        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 350px;
            color: var(--text-secondary);
            text-align: center;
        }

        .placeholder-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--text-secondary);
            opacity: 0.4;
            margin-bottom: 1rem;
        }

        /* Corporate Clean Footer */
        footer {
            width: 100%;
            max-width: 1200px;
            margin: auto auto 0 auto;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .footer-brand {
            font-weight: 600;
            letter-spacing: -0.01em;
        }
    </style>
</head>

    <!-- Main Operational Workspace -->
    <main>
        <!-- Analytical Capture Unit -->
        <section class="card">
            <h2 class="card-title">Metrics Engine</h2>
            <form id="cutoff-form" novalidate>
                <div class="form-group">
                    <label for="student-name">Candidate Name <span style="font-weight:400; opacity:0.6;">(Optional)</span></label>

                        <input type="number" id="chemistry" placeholder="0 - 100" min="0" max="100" step="any" required>
                        <span class="unit">/ 100</span>
                    </div>
                    <div class="validation-msg" id="v-chemistry"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="compute-btn">
                    <span class="btn-default-text">Process Analysis</span>
                    <span class="btn-loading-text"><span class="spinner"></span>Synthesizing Records...</span>
                </button>
            </form>
        </section>

        <!-- Predictive Intelligence Output -->
        <section class="card" id="output-container">
            <div class="placeholder-state" id="placeholder">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z"></path>
                </svg>
                <p>Provide score configurations to initialize diagnostic predictive models.</p>
            </div>
