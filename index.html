<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TNEA Cutoff Calculator | Aethercore Interactive</title>

    <meta name="keywords" content="TNEA, Cutoff Calculator, Tamil Nadu Engineering Admission, Anna University, Engineering Cutoff">
    <meta name="author" content="Aethercore Interactive">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TNEA Cutoff Calculator | Aethercore Interactive">
    <meta property="og:description" content="Calculate your Tamil Nadu Engineering Admissions (TNEA) cutoff instantly with our enterprise-grade predictive tool.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Light Mode Variables */
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --input-bg: rgba(255, 255, 255, 0.9);
            --glow: rgba(99, 102, 241, 0.1);
        }

        [data-theme="dark"] {
            /* Dark Mode Variables */
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --accent: #38bdf8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.3);
            --input-bg: rgba(15, 23, 42, 0.4);
            --glow: rgba(129, 140, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Locks viewport securely on mobile screens */
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ambient Decorative Glows */
        .ambient-glow-1, .ambient-glow-2 {
            position: fixed;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }
        .ambient-glow-1 { top: -20%; left: -20%; }
        .ambient-glow-2 { bottom: -20%; right: -20%; }

        /* Branding Corporate Header Layout */
        header {
            width: 100%;
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            z-index: 10;
        }

        .brand-block {
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .brand svg {
            width: 22px;
            height: 22px;
            fill: var(--primary);
        }

        .brand-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            letter-spacing: 0.02em;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.45rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .theme-toggle svg {
            width: 16px;
            height: 16px;
            fill: var(--text-primary);
        }

        /* Viewport Containment Framework */
        main {
            flex: 1;
            width: 100%;
            padding: 0.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Strict structure containment */
        }

        /* Glassmorphism Unified Platform Form Container */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: var(--shadow);
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Compact Layout Entry System Matrix */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            white-space: nowrap;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.55rem 0.65rem;
            border-radius: 8px;
            border: 1.5px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 700;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
        }

        /* Compact Inline Data Verification Alerts */
        .validation-msg {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--danger);
            margin-top: 0.15rem;
            height: 12px;
            opacity: 0;
            transform: translateY(-2px);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .validation-msg.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Engine Operation Switches */
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-loading-text { display: none; }
        .loading .btn-default-text { display: none; }
        .loading .btn-loading-text { display: flex; align-items: center; gap: 0.5rem; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dedicated Results Architecture Display Block Below */
        .results-wrapper {
            flex: 1;
            margin-top: 0.75rem;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            font-size: 0.8rem;
            padding: 1rem;
        }

        .placeholder-state svg {
            width: 36px;
            height: 36px;
            stroke: var(--text-secondary);
            opacity: 0.3;
            margin-bottom: 0.4rem;
        }

        #result-content {
            display: none;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        #result-content.visible {
            display: flex;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-display {
            text-align: center;
            margin-bottom: 0.4rem;
        }

        .cutoff-value {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .cutoff-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 700;
            margin-top: 0.15rem;
        }

        /* Classification Node Arrays */
        .prediction-badge {
            padding: 0.4rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .tier-top { background: rgba(16, 185, 129, 0.12); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .tier-strong { background: rgba(14, 165, 233, 0.12); color: var(--accent); border: 1px solid rgba(14, 165, 233, 0.2); }
        .tier-moderate { background: rgba(245, 158, 11, 0.12); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.2); }
        .tier-limited { background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        /* Computation Details Grid */
        .breakdown-box {
            background: rgba(15, 23, 42, 0.05);
            border-radius: 10px;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.5rem;
            border: 1px dashed var(--card-border);
        }

        [data-theme="dark"] .breakdown-box {
            background: rgba(15, 23, 42, 0.25);
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 0.2rem;
        }

        .breakdown-row:last-child {
            margin-bottom: 0;
            padding-top: 0.2rem;
            border-top: 1px solid var(--card-border);
            font-weight: 700;
        }

        /* Action Suite Matrix */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.4rem;
        }

        .btn-action {
            background: rgba(15, 23, 42, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.4rem;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
        }

        [data-theme="dark"] .btn-action {
            background: rgba(15, 23, 42, 0.2);
        }

        .btn-action svg {
            width: 14px;
            height: 14px;
            fill: var(--text-secondary);
        }

        /* Alert Overlay Engine */
        .toast-container {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 2.5rem);
            max-width: 300px;
        }

        .toast {
            background: var(--text-primary);
            color: var(--input-bg);
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            box-shadow: var(--shadow);
            margin-top: 0.4rem;
            animation: toastIn 0.2s ease-out forwards;
        }

        @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Fixed Navigation System Footer */
        footer {
            width: 100%;
            padding: 0.5rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            z-index: 10;
        }
        
        .footer-brand { font-weight: 700; }
    </style>
</head>
